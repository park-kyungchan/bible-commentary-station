<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sanctuaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22416E"/>
      <stop offset="100%" stop-color="#142947"/>
    </linearGradient>
    <linearGradient id="sanctuaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C272"/>
      <stop offset="100%" stop-color="#C69238"/>
