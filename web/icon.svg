  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sanctuaryBg)"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="url(#sanctuaryGold)" stroke-opacity="0.32" stroke-width="3"/>
  <!-- Cross -->
