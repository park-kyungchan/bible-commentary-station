[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-commentary-station"
dynamic = ["version"]
description = "Offline-first Biblical Exegesis, 12-Commentary Reference, Worship/Liturgy & Pastoral Sermon Workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bible-station = "bible_station.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bible_station.__version__" }

[tool.setuptools.packages.find]
include = ["bible_station*"]

[tool.setuptools.package-data]
bible_station = ["*.json"]
