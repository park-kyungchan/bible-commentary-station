[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-commentary-station"
version = "2.0.0"
description = "Offline-first Biblical Exegesis, 8-Commentary Comparison, Cross-Reference & Pastoral Sermon Workstation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
bible-station = "bible_station.cli:main"

[tool.setuptools.packages.find]
include = ["bible_station*"]
