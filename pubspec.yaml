name: bible_commentary_workstation
description: "Sanctuary Paper Biblical Exegesis & Commentary Pastoral Workstation"
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local SQLite FTS5 engine
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Pulpit Mode screen wakelock
  wakelock_plus: ^1.2.8

  # Master SQLite bundle download & mandatory SHA-256 verification
  http: ^1.2.2
  crypto: ^3.0.5

  # Google Drive sermon backup & sync
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
