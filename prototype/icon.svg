  <line x1="256" y1="245" x2="256" y2="390" stroke="#C59B27" stroke-width="5" stroke-linecap="round"/>
  <!-- Page Lines Left -->
  <line x1="140" y1="270" x2="230" y2="282" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="300" x2="230" y2="312" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="330" x2="230" y2="342" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <!-- Page Lines Right -->
  <line x1="282" y1="282" x2="372" y2="270" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="282" y1="312" x2="372" y2="300" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <line x1="282" y1="342" x2="372" y2="330" stroke="#CBD5E0" stroke-width="6" stroke-linecap="round"/>
  <!-- Alpha & Omega or Exegesis Ribbon -->
  <path d="M256 245 L256 425 L244 412 L232 425 L232 245" fill="url(#gold)"/>
</svg>
