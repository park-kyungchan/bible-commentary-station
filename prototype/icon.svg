<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2B49"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- Cross in Gold -->
  <path d="M256 90 V200 M210 130 H302" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <!-- Open Bible Pages -->
  <path d="M110 240 C170 215, 230 220, 256 245 C282 220, 342 215, 402 240 V385 C342 360, 282 365, 256 390 C230 365, 170 360, 110 385 Z" fill="#FBF8F1" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
